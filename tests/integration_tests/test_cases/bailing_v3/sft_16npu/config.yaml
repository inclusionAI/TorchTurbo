UPDATE_GOLDEN: false

MODEL_ARGS: {}

TRAIN_ARGS:
  model:
    source: huggingface
    repo: inclusionAI/Ling-3.0-tiny
    revision: 9a98e35fe1c9ee255f78dd64771c7ae15a799481
    fallback:
      source: modelscope
      repo: inclusionAI/Ling-3.0-tiny
      revision: 0a9ee734a409577fa0cff0ff48b48df008e7d8d4
  dataset:
    source: huggingface
    repo: a-m-team/AM-Thinking-v1-Distilled
    revision: 186b575b5cc2113f8ba81d4f4ac9ae2494633829
    file: science.jsonl
    fallback:
      source: modelscope
      repo: a-m-team/AM-Thinking-v1-Distilled
      revision: f231097a64f61c091ef220672f3e6cc130f2cdb7
      file: science.jsonl
  model_type: turbo_bailing_hybrid
  template: ling_v3
  check_model: false
  add_non_thinking_prefix: true
  loss_scale: ignore_empty_think
  tuner_type: full
  attn_impl: flash_attn
  torch_dtype: bfloat16
  bf16: true
  num_train_epochs: 1
  max_steps: 4
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  optim: adamw_torch
  learning_rate: 1.25e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.0
  weight_decay: 0.1
  max_grad_norm: 1.0
  seed: 1234
  data_seed: 1234
  max_length: 4096
  packing: true
  packing_length: 4096
  packing_num_proc: 1
  dataset_num_proc: 96
  dataloader_num_workers: 4
  load_from_cache_file: true
  split_dataset_ratio: 0.0
  logging_strategy: steps
  logging_steps: 1
  report_to: tensorboard
  add_version: false

ENGINE_CONFIG:
  backend: fsdp2
  mixed_precision: bf16
  parallel_plan:
    sp_size: 4
    ep_size: 8
  activation_checkpointing:
    enabled: true
    use_reentrant: true
  moe:
    aux_loss_coeff: 1.0e-6
  loss_chunk:
    enabled: true
  mtp:
    enabled: false

LAUNCH_ARGS:
  nproc_per_node: 16
  nnodes: 1
  node_rank: 0
  master_addr: 127.0.0.1
  master_port: 29500

ENV_VARS:
  HF_ENDPOINT: https://hf-mirror.com
  TOKENIZERS_PARALLELISM: 'false'
  HF_HUB_OFFLINE: '0'
  HF_DATASETS_OFFLINE: '0'
  HCCL_CONNECT_TIMEOUT: '7200'
  HCCL_EXEC_TIMEOUT: '7200'
  HCCL_EVENT_TIMEOUT: '14500'
  ACL_DEVICE_SYNC_TIMEOUT: '14400'
  HCCL_OP_EXPANSION_MODE: AI_CPU
  ASCEND_GLOBAL_LOG_LEVEL: '3'
  PYTORCH_NPU_ALLOC_CONF: 'expandable_segments:True'
  HCCL_ASYNC_ERROR_HANDLING: '0'
  HCCL_IF_BASE_PORT: '29972'
  GLOO_SOCKET_IFNAME: eth0
  GLOO_LOG_LEVEL: DEBUG
  MULTI_STREAM_MEMORY_REUSE: '1'
