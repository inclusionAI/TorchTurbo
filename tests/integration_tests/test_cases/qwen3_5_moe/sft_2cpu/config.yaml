UPDATE_GOLDEN: false

# MODEL_ARGS is identical to sft_2npu: the CPU case must build the same model.
MODEL_ARGS:
  model_type: qwen3_5_moe
  image_token_id: 2007
  video_token_id: 2008
  vision_start_token_id: 2005
  vision_end_token_id: 2006
  text_config:
    hidden_size: 128
    num_hidden_layers: 2
    layer_types:
      - linear_attention
      - full_attention
    num_attention_heads: 4
    num_key_value_heads: 2
    head_dim: 32
    linear_num_key_heads: 4
    linear_num_value_heads: 8
    linear_key_head_dim: 128
    linear_value_head_dim: 128
    linear_conv_kernel_dim: 4
    moe_intermediate_size: 64
    shared_expert_intermediate_size: 64
    num_experts: 8
    num_experts_per_tok: 4
    mtp_num_hidden_layers: 0
    max_position_embeddings: 512
    use_cache: false
    tie_word_embeddings: false
  vision_config:
    depth: 2
    hidden_size: 64
    intermediate_size: 128
    num_heads: 4
    patch_size: 16
    spatial_merge_size: 2
    temporal_patch_size: 2
    out_hidden_size: 128
    num_position_embeddings: 1024

# ms-swift rather than llamafactory, because swift installs cleanly on a
# developer host. Three settings differ from sft_2npu on purpose:
#   attn_impl: eager   - no flash-attention kernel builds for CPU
#   packing: false     - eager attention has no packed varlen path
#   float32            - CPU autocast would not exercise the real kernels
TRAIN_ARGS:
  model: null
  tokenizer: assets/tokenizer/qwen3_5_moe
  dataset: assets/sft_test/data.json
  model_type: turbo_qwen3_5_moe
  template: qwen3_5
  check_model: false
  tuner_type: full
  attn_impl: eager
  torch_dtype: float32
  bf16: false
  use_cpu: true
  max_steps: 15
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  max_length: 512
  packing: false
  lr_scheduler_type: cosine
  learning_rate: 1.25e-5
  warmup_ratio: 0.0
  seed: 42
  data_seed: 42
  dataset_num_proc: 1
  dataloader_num_workers: 0
  load_from_cache_file: false
  split_dataset_ratio: 0.0
  logging_strategy: steps
  logging_steps: 1
  report_to: tensorboard
  add_version: false

ENGINE_CONFIG:
  backend: fsdp2
  mixed_precision: fp32
  parallel_plan:
    sp_size: 1
    ep_size: 1
  freeze_policy:
    vision_tower: true
    multi_modal_projector: true
  mtp:
    enabled: false

LAUNCH_ARGS:
  nproc_per_node: 2
  nnodes: 1
  node_rank: 0
  master_addr: 127.0.0.1
  master_port: 29501

# No HCCL/ASCEND tuning and no GLOO_SOCKET_IFNAME: gloo picks the loopback
# interface itself, and eth0 does not exist on a developer host.
ENV_VARS:
  TOKENIZERS_PARALLELISM: 'false'
  HF_HUB_OFFLINE: '1'
  HF_DATASETS_OFFLINE: '1'
  VIDEO_PLACEHOLDER: <qwen3_5_video_placeholder>
  AUDIO_PLACEHOLDER: <qwen3_5_audio_placeholder>
  IMAGE_PLACEHOLDER: <qwen3_5_image_placeholder>
  WANDB_DISABLED: 'True'
  ALLOW_EXTRA_ARGS: 'True'
  TRANSFORMERS_VERBOSITY: error
