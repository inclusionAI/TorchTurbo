engine_config:
  parallel_plan:
    sp_size: 4
    ep_size: 128
  backend_config:
    pin_memory: false
    cpu_offload:
      enabled: true
      mode: full
  moe:
    z_loss_coeff: 0.0000029
    async_comm: true
    inplace_perm: false
    gmm_fold: false
    router_bias_gamma: 0.001
    router_bias_clamp: 0.1
  activation_checkpointing:
    use_reentrant: true
  loss_chunk:
    enabled: true
  mfu:
    enabled: true
  mtp:
    enabled: true
    loss_scaling_factor: 0.1
